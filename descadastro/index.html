<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Metatags Básicas -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cancelamento de Inscrição | Pombagiras.com</title>
    <meta name="description" content="Página de cancelamento de inscrição da Carta das Pombagiras. Respeito total à sua privacidade e autonomia.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050002">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.pombagiras.com/assets/favicon-round-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.pombagiras.com/assets/apple-touch-icon-round.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #050002;
            --text-color: #FAF6EE;
            --text-secondary: #e6e2d8;
            --muted-text: #96a3a8;
            --gold: #C5A059;
            --gold-light: #dfc07e;
            --glass-card: rgba(18, 10, 14, 0.85);
            --glass-border: rgba(197, 160, 89, 0.25);
            --ff-display: 'Fraunces', serif;
            --ff-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --ff-mono: 'Geist Mono', monospace;
        }

        body {
            background: linear-gradient(135deg, #050203 0%, #0d0608 50%, #12090b 100%);
            min-height: 100vh;
            color: var(--text-color);
            font-family: var(--ff-sans);
            line-height: 1.7;
            overflow-x: hidden;
            overflow-wrap: break-word;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.2rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.022;
            z-index: -1;
            pointer-events: none;
        }

        .unsubscribe-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55);
            position: relative;
            backdrop-filter: blur(12px);
        }

        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--ff-display);
            font-size: 1.25rem;
            color: var(--gold-light);
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .brand-link img {
            border-radius: 50%;
        }

        .status-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 auto 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: var(--gold-light);
            transition: all 0.3s ease;
        }

        .status-icon.success {
            background: rgba(46, 125, 50, 0.15);
            border-color: rgba(76, 175, 80, 0.4);
            color: #8ce99a;
        }

        .status-icon.info {
            background: rgba(197, 160, 89, 0.15);
            border-color: rgba(197, 160, 89, 0.4);
            color: var(--gold-light);
        }

        h1 {
            font-family: var(--ff-display);
            font-size: clamp(1.4rem, 3.5vw, 1.85rem);
            color: var(--gold-light);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        p.explanation {
            font-size: 0.96rem;
            color: var(--text-secondary);
            line-height: 1.65;
            margin-bottom: 1.8rem;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.6rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            background: var(--gold);
            color: #050002;
            transition: all 0.25s ease;
        }

        .action-btn:hover {
            background: #fff;
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--muted-text);
        }

        @media (max-width: 600px) {
            .unsubscribe-card {
                padding: 2rem 1.2rem;
            }
            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="unsubscribe-card">
        <a href="https://pombagiras.com/" class="brand-link">
            <img src="https://cdn.pombagiras.com/assets/favicon-round-32.png" alt="Símbolo Pombagiras.com" width="28" height="28">
            POMBAGIRAS.COM
        </a>

        <div class="status-icon info" id="status-icon">
            <i class="fa-solid fa-spinner fa-spin" id="icon-inner"></i>
        </div>

        <h1 id="status-title">Processando cancelamento...</h1>
        <p class="explanation" id="status-desc">
            Aguarde um instante enquanto removemos seu e-mail da lista com segurança.
        </p>

        <a href="https://pombagiras.com/" class="action-btn" id="action-btn">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar para a Página Inicial</span>
        </a>

        <p class="footer-note">
            Portal Pombagiras.com &bull; O conhecimento ancestral continua livre e 100% gratuito.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            const iconEl = document.getElementById('status-icon');
            const iconInner = document.getElementById('icon-inner');
            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');

            // Validação simples de formato UUID
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

            if (!id || !uuidRegex.test(id)) {
                iconEl.className = 'status-icon info';
                iconInner.className = 'fa-solid fa-circle-info';
                titleEl.textContent = 'Link de cancelamento não reconhecido';
                descEl.textContent = 'O código identificador informado não foi localizado. Caso queira cancelar manualmente ou precise de apoio, basta escrever diretamente para contato@pombagiras.com.';
                return;
            }

            try {
                const resp = await fetch('https://qeayxaqcwajitbrzdhzp.supabase.co/rest/v1/rpc/unsubscribe_newsletter', {
                    method: 'POST',
                    headers: {
                        'apikey': 'sb_publishable_2np1-QAVxRzRYwhlS4FHeA_otT0J9VI',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlYXl4YXFjd2FqaXRicnpkaHpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NTc1NDIsImV4cCI6MjEwOTUzMzU0Mn0.ykY2C4BRy6UNWrJQ6ZfMo9ph4J4aFoe3APkRrlGh1js',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ subscriber_id: id })
                });

                const result = await resp.json();

                if (resp.ok && result && result.success) {
                    iconEl.className = 'status-icon success';
                    iconInner.className = 'fa-solid fa-leaf';
                    titleEl.textContent = 'Inscrição cancelada com serenidade.';
                    descEl.textContent = 'Seu e-mail foi removido da lista da Carta das Pombagiras. Você não receberá novas mensagens. Nenhuma mágoa, nenhum rancor: as portas deste templo de conhecimento ancestral permanecem sempre abertas e 100% gratuitas para você.';
                } else {
                    iconEl.className = 'status-icon info';
                    iconInner.className = 'fa-solid fa-check';
                    titleEl.textContent = 'Inscrição já cancelada';
                    descEl.textContent = 'Seu e-mail já não consta na lista ativa da Carta das Pombagiras. Nenhuma nova mensagem será enviada para você.';
                }
            } catch (err) {
                iconEl.className = 'status-icon info';
                iconInner.className = 'fa-solid fa-envelope-open-text';
                titleEl.textContent = 'Solicitação recebida';
                descEl.textContent = 'Não conseguimos conexão imediata com o servidor, mas sua vontade é soberana. Se desejar confirmação imediata, basta nos enviar um e-mail em contato@pombagiras.com.';
            }
        });
    </script>
</body>
</html>
